<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DreamWork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efff; --bg2:#ffe9dc; --ink:#241d45; --soft:#6b6390;
  --glass:rgba(255,255,255,.62); --edge:rgba(120,100,200,.22);
  --me1:#7c6bff; --me2:#b58cff; --me-ink:#fff;
  --a:#9b8cff; --b:#ffb68a; --c:#6fe3d0;
  --shadow:0 18px 50px rgba(90,70,170,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0b24; --bg2:#1d1238; --ink:#efeaff; --soft:#a59ccf;
    --glass:rgba(34,26,68,.62); --edge:rgba(170,150,255,.2);
    --shadow:0 18px 50px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0f0b24; --bg2:#1d1238; --ink:#efeaff; --soft:#a59ccf;
  --glass:rgba(34,26,68,.62); --edge:rgba(170,150,255,.2);
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;font-weight:300;overflow:hidden}
.sky{position:fixed;inset:0;background:linear-gradient(160deg,var(--bg),var(--bg2));z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.blob.b1{width:52vmax;height:52vmax;left:-18vmax;top:-14vmax;background:var(--a)}
.blob.b2{width:44vmax;height:44vmax;right:-16vmax;bottom:-12vmax;background:var(--b);animation-duration:28s}
.blob.b3{width:30vmax;height:30vmax;left:40%;top:45%;background:var(--c);opacity:.28;animation-duration:34s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
.app{position:relative;z-index:1;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding:0 14px}
header{display:flex;align-items:center;gap:12px;padding:14px 4px}
.orb{width:38px;height:38px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#fff 0,var(--c) 24%,var(--a) 58%,#5b49d6 100%);box-shadow:0 0 22px rgba(155,140,255,.7);animation:breathe 5s ease-in-out infinite}
.orb.think{animation:pulse 1s ease-in-out infinite;box-shadow:0 0 34px rgba(255,182,138,.9)}
@keyframes breathe{50%{transform:scale(1.08);box-shadow:0 0 32px rgba(111,227,208,.6)}}
@keyframes pulse{50%{transform:scale(1.22)}}
.brand{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:500;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:Outfit,sans-serif;font-size:12px;font-weight:300;color:var(--soft);margin-top:4px;letter-spacing:0}
.spacer{flex:1}
.icon{border:1px solid var(--edge);background:var(--glass);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:16px}
.icon:focus-visible,.chip:focus-visible,.send:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#feed{flex:1;overflow-y:auto;padding:8px 2px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hero{margin:auto 0;padding:10px 6px 30px}
.hero h1{font-family:Fraunces,Georgia,serif;font-weight:300;font-size:clamp(34px,8vw,52px);line-height:1.08;margin:0 0 14px;letter-spacing:-.01em}
.hero h1 i{font-style:italic;color:var(--a)}
.hero p{margin:0 0 22px;color:var(--soft);font-size:16px;max-width:34ch;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--edge);background:var(--glass);color:var(--ink);font:inherit;font-size:14px;padding:10px 15px;border-radius:999px;cursor:pointer;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s,border-color .2s}
.chip:hover{transform:translateY(-2px);border-color:var(--a)}
.msg{max-width:85%;padding:12px 16px;border-radius:20px;line-height:1.55;font-size:15.5px;white-space:pre-wrap;word-wrap:break-word;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--me1),var(--me2));color:var(--me-ink);border-bottom-right-radius:6px;box-shadow:0 8px 24px rgba(124,107,255,.35)}
.msg.ai{align-self:flex-start;background:var(--glass);border:1px solid var(--edge);border-bottom-left-radius:6px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.dots{display:inline-flex;gap:5px;padding:4px 2px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--a);animation:bob 1.1s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--b)}
.dots span:nth-child(3){animation-delay:.3s;background:var(--c)}
@keyframes bob{50%{transform:translateY(-6px);opacity:.5}}
.composer{display:flex;align-items:flex-end;gap:8px;margin:4px 0 14px;padding:8px 8px 8px 18px;border-radius:28px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow)}
textarea{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;resize:none;max-height:140px;padding:9px 0;outline-offset:6px}
textarea::placeholder{color:var(--soft)}
.send{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;flex:none;color:#fff;font-size:18px;background:linear-gradient(135deg,var(--me1),var(--b));transition:transform .2s,opacity .2s}
.send:hover{transform:scale(1.08)}.send:disabled{opacity:.4;cursor:default;transform:none}
.note{text-align:center;font-size:12px;color:var(--soft);margin:-6px 0 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sky"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="app">
  <header>
    <div class="orb" id="orb"></div>
    <div class="brand">DreamWork<small id="status">Online</small></div>
    <div class="spacer"></div>
    <button class="icon" id="theme" aria-label="Switch light or dark theme">☾</button>
    <button class="icon" id="clear" aria-label="Start a new chat">+</button>
  </header>
  <main id="feed" aria-live="polite"></main>
  <div class="composer">
    <textarea id="box" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea>
    <button class="send" id="send" aria-label="Send message">↑</button>
  </div>
</div>
<script>
// ── Your GPTBots details ──
const API_KEY = "app-1TfCqaDNMoHfXQzXIKSTbMOh";
const REGIONS = ["sg","jp","th"];   // tries each data center until one works
let base = null;
// ──────────────────────────
const feed = document.getElementById('feed'), box = document.getElementById('box');
const sendBtn = document.getElementById('send'), orb = document.getElementById('orb');
let convoId = null, busy = false;

const hello = () => {
  feed.innerHTML = '';
  const h = document.createElement('div'); h.className = 'hero';
  h.innerHTML = '<h1>What are we <i>dreaming up</i> today?</h1><p>Ask a question, draft an idea, or think out loud. I’m here.</p><div class="chips"></div>';
  ['Plan my week gently','Explain something simply','Help me write a message','Surprise me'].forEach(t=>{
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = t;
    b.onclick = () => send(t); h.querySelector('.chips').appendChild(b);
  });
  feed.appendChild(h);
};
const add = (text, who) => {
  document.querySelector('.hero')?.remove();
  const m = document.createElement('div'); m.className = 'msg ' + who; m.textContent = text;
  feed.appendChild(m); feed.scrollTop = feed.scrollHeight; return m;
};
const mock = q => new Promise(r => setTimeout(() => r(
  'This is a preview reply to “' + q.slice(0,60) + '”. Once your backend is connected, the real GPTBots agent will answer here, and this same interface will display it.'
), 1400));

async function gb(b, path, payload){
  const res = await fetch(b + path, {
    method:'POST',
    headers:{'Authorization':'Bearer ' + API_KEY,'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
  return res.json();
}
const errs = {20022:'The agent is out of credits.',20055:'API access is switched off for this agent in GPTBots.',40127:'The API key was rejected.'};
async function getReply(q){
  try{
    if(!convoId){
      let last = {};
      for(const r of (base ? [base] : REGIONS.map(x=>'https://api-'+x+'.gptbots.ai'))){
        const c = await gb(r,'/v1/conversation',{user_id:'dw-' + Math.random().toString(36).slice(2,14)});
        if(c.conversation_id){ base = r; convoId = c.conversation_id; break; }
        last = c;
      }
      if(!convoId) throw new Error(errs[last.code] || last.message || 'Could not start a chat.');
    }
    const d = await gb(base,'/v2/conversation/message',{conversation_id:convoId,response_mode:'blocking',messages:[{role:'user',content:q}]});
    if(!Array.isArray(d.output)) throw new Error(errs[d.code] || d.message || 'GPTBots returned an error.');
    return d.output.map(o=>(o&&o.content&&o.content.text)||'').filter(Boolean).join('\n\n') || '…';
  }catch(e){
    if(e instanceof TypeError) throw new Error('The browser blocked the request to GPTBots. Tell Claude: "CORS blocked".');
    throw e;
  }
}
async function reveal(el, text){
  const words = text.split(' ');
  el.textContent = '';
  for(let i=0;i<words.length;i++){
    el.textContent += (i?' ':'') + words[i];
    feed.scrollTop = feed.scrollHeight;
    await new Promise(r=>setTimeout(r,28));
  }
}
async function send(text){
  text = (text ?? box.value).trim();
  if(!text || busy) return;
  busy = true; sendBtn.disabled = true; box.value = ''; box.style.height = 'auto';
  add(text,'me'); orb.classList.add('think');
  const el = add('','ai'); el.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  try{ await reveal(el, await getReply(text)); }
  catch(e){ el.textContent = (e && e.message) || 'Something went wrong. Try again.'; }
  orb.classList.remove('think'); busy = false; sendBtn.disabled = false; box.focus();
}
sendBtn.onclick = () => send();
box.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
box.addEventListener('input', () => { box.style.height='auto'; box.style.height = Math.min(box.scrollHeight,140)+'px'; });
document.getElementById('clear').onclick = () => { convoId = null; hello(); };
document.getElementById('theme').onclick = () => {
  const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue('--bg').trim()==='#0f0b24';
  r.dataset.theme = dark ? 'light' : 'dark';
  document.getElementById('theme').textContent = dark ? '☾' : '☀';
};
hello();
</script>
</body>
</html>
